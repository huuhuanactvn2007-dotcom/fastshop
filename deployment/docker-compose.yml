services:
  fastshop-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: fastshop-sqlserver-huan
    restart: always
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - fastshop_db_huan:/var/opt/mssql
    networks:
      - fastshop-net

  fastshop-app:
    image: fastshop-backend-huan:v1
    build:
      context: ../          
      dockerfile: Dockerfile
    container_name: fastshop-app-huan
    restart: always
    ports:
      - "8002:8000"
    depends_on:
      - fastshop-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://fastshop-db:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true;sslProtocol=TLSv1.2;
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=${SERVER_PORT}

      - SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
    networks:
      - fastshop-net

  huan-nginx-proxy:
    image: nginx:latest
    container_name: huan_reverse_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - fastshop-app
    networks:
      - fastshop-net
 
networks:
  fastshop-net:
    driver: bridge

volumes:
  fastshop_db_huan:
