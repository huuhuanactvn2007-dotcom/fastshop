server {
    listen 80;
    server_name huan20.io.vn api.huan20.io.vn admin.huan20.io.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name huan20.io.vn;

    ssl_certificate /etc/letsencrypt/live/huan20.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huan20.io.vn/privkey.pem;

    location / {
        proxy_pass http://fastshop-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

